<style>
:root{--ink:#0d1820;--ink-2:#3d4a54;--ground:#eef1f3;--ground-2:#f7f8f9;--cyan:#36d8e8;--cyan-deep:#0b8fa3;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ground);-webkit-font-smoothing:antialiased}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:48px 16px;text-align:center;
  font:400 17px/1.55 Figtree,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 600px at 50% 0%,#fff 0%,rgba(255,255,255,0) 60%),linear-gradient(180deg,var(--ground-2),var(--ground) 40%)}
img{height:32px;width:auto}
h1{font:700 clamp(34px,6vw,60px)/1.02 Urbanist,sans-serif;letter-spacing:-.04em;max-width:14ch;text-wrap:balance}
p{color:var(--ink-2);max-width:40ch}
a.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;
  font:600 15px/1 Figtree,sans-serif;text-decoration:none;box-shadow:0 10px 30px -10px rgba(6,96,110,.55);transition:transform .5s var(--ease)}
a.btn:hover{transform:translateY(-2px)}
a.btn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan-deep);outline-offset:3px}
</style>
